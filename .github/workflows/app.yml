name: app

# The frozen Electron shell and React UI. They get no new features and are deleted at the 2.0 cutover; until
# then these checks run when someone touches them. The Rust workspace has its own workflow, rust.yml.
# Pull requests and main call this with caches on. A release calls it with caches off.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag on main to check (empty means the triggering ref)
        type: string
        default: ""
      os:
        description: JSON list of runners
        type: string
        default: '["windows-latest", "ubuntu-24.04"]'
      e2e:
        description: Run the UI e2e specs on the fake Companion
        type: boolean
        default: true
      cache:
        description: Restore the pnpm and Rust caches. Pull request and main checks only, never a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    name: Resolve checked revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and pin the checked revision
        id: source
        shell: bash
        env:
          EXPLICIT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$EXPLICIT_REF" ]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            git merge-base --is-ancestor HEAD origin/main || {
              echo '::error::An explicit app ref must be a commit on origin/main.'
              exit 1
            }
          fi
          revision=$(git rev-parse --verify 'HEAD^{commit}')
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  checks:
    needs: source
    name: lint and unit tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ inputs.cache && 'pnpm' || '' }}
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  electron:
    needs: source
    name: electron specs
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false

      - uses: ./.github/actions/rust-setup
        with:
          cache: ${{ inputs.cache }}
          cache-key: electron

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ inputs.cache && 'pnpm' || '' }}
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Build the UI that the Companion embeds
        run: pnpm build:ui
      - name: Build the Companion for Electron specs
        run: cargo build -p td-companion --features test-hooks
      # The Rust workflow tests the Companion without a built UI. This runs the same test on every real asset.
      - name: Test the Companion serves the built UI
        run: cargo test -p td-companion --test embedded_ui
      - name: Run the Electron Playwright specs
        run: pnpm --filter @touchdeck/electron e2e
      # Each failed Electron spec leaves its error context and the Companion and Electron logs here.
      - name: Keep the output of failed Electron specs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-e2e-output
          path: .verify/72/playwright/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    needs: source
    name: e2e ${{ matrix.shard }}/4
    if: inputs.e2e
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ inputs.cache && 'pnpm' || '' }}
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --filter touchdeck-ui
      - name: Run the UI e2e specs on the fake Companion
        run: pnpm e2e:ui --shard=${{ matrix.shard }}/4

      # playwright.config.ts keeps a trace for each failed spec; without this they die with the runner.
      - name: Keep the traces of failed specs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: app/ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
