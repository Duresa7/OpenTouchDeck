name: pull request

# Runs only the checks a pull request's changed paths need; .github/scripts/changed-areas.sh maps paths to checks.
# gate is the one required check: it passes when every check that ran passed.
on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the push before it.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      frozen: ${{ steps.paths.outputs.frozen }}
      scripts: ${{ steps.paths.outputs.scripts }}
      firmware: ${{ steps.paths.outputs.firmware }}
      actionlint: ${{ steps.paths.outputs.actionlint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the path filter
        run: bash .github/scripts/test-changed-areas.sh
      - name: Find changed areas
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" | bash .github/scripts/changed-areas.sh | tee -a "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      cache: true

  frozen-app:
    needs: changes
    if: needs.changes.outputs.frozen == 'true'
    uses: ./.github/workflows/app.yml
    with:
      cache: true

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    uses: ./.github/workflows/scripts.yml

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/firmware.yml
    with:
      cache: true

  actionlint:
    needs: changes
    if: needs.changes.outputs.actionlint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --strict -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  gate:
    name: gate
    needs: [changes, rust, frozen-app, scripts, firmware, actionlint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful or skipped checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
