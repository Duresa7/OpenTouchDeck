name: windows evidence

# TEMPORARY probe: learns what the runner's desktop offers. Replaced before review.
on:
  workflow_dispatch:
  push:
    branches: [ci/m1-windows-evidence]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the runner
        shell: powershell
        run: ./.github/scripts/windows-evidence/environment.ps1 -Out "$env:RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-evidence
          path: ${{ runner.temp }}/evidence
