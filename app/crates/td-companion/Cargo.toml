[package]
name = "td-companion"
version = "2.0.0-preview.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-hooks = ["dep:reqwest", "dep:tokio-tungstenite", "dep:tempfile", "td-link/fake", "td-host/testing"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
td-core = { workspace = true, features = ["ts"] }
td-host.workspace = true
td-updater = { path = "../td-updater" }
td-link.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ts-rs = { version = "11", features = ["serde-json-impl"] }
inventory = "0.3"
getrandom = "0.3"
keyring = "4"
zeroize = "1"
semver = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
futures-util = "0.3"
serialport = "4"
serde_urlencoded = "0.7"
thiserror = "2"
unicode-segmentation = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
fs2 = "0.4"
hyper-util = { version = "0.1", features = ["http1", "server-auto", "server-graceful", "service", "tokio"] }
parking_lot = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3"
td-link.workspace = true

[dev-dependencies]
flate2 = "1"
gif = { version = "0.14", default-features = false, features = ["std"] }
td-companion = { path = ".", features = ["test-hooks"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
