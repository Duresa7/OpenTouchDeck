<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Open TouchDeck app and tray icon, 16 px. Fitted to the 16 px grid: body 16 x 11 at y 2, 1 px rim, case edge 1 px, Tiles 4 x 4 with 1 px gaps, touching the rim, no pager. -->
  <!-- case edge -->
  <rect x="0" y="3" width="16" height="11" rx="2" fill="#66738a"/>
  <!-- rim: the lighter edge that keeps the outline on a dark taskbar -->
  <rect x="0" y="2" width="16" height="11" rx="2" fill="#4b5564"/>
  <!-- black glass -->
  <rect x="1" y="3" width="14" height="9" rx="1" fill="#151a21"/>
  <!-- Tiles: 3 x 2, the first one lit -->
  <rect x="1" y="3" width="4" height="4" rx="0.5" fill="#8ccaff"/>
  <rect x="6" y="3" width="4" height="4" rx="0.5" fill="#4f77b4"/>
  <rect x="11" y="3" width="4" height="4" rx="0.5" fill="#4f77b4"/>
  <rect x="1" y="8" width="4" height="4" rx="0.5" fill="#4f77b4"/>
  <rect x="6" y="8" width="4" height="4" rx="0.5" fill="#4f77b4"/>
  <rect x="11" y="8" width="4" height="4" rx="0.5" fill="#4f77b4"/>
</svg>
