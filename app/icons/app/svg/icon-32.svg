<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Open TouchDeck app icon, 32 px. Fitted to the 32 px grid: body 32 x 22 at y 4, 1 px rim, case edge 2 px, Tiles 8 x 7 with 1 px gaps, 3 px in from the body edge, pager 1 px high. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d889b"/>
      <stop offset="0.4" stop-color="#4e5766"/>
      <stop offset="1" stop-color="#454d5a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272c34"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#466aa1"/>
      <stop offset="1" stop-color="#3a598c"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d6ff"/>
      <stop offset="1" stop-color="#4c9df6"/>
    </linearGradient>
  </defs>
  <!-- case edge -->
  <rect x="0" y="6" width="32" height="22" rx="4" fill="#5f6b80"/>
  <!-- rim: the lighter edge that keeps the outline on a dark taskbar -->
  <rect x="0" y="4" width="32" height="22" rx="4" fill="url(#rim)"/>
  <!-- black glass -->
  <rect x="1" y="5" width="30" height="20" rx="3" fill="url(#glass)"/>
  <!-- screen -->
  <rect x="2" y="6" width="28" height="18" rx="2" fill="url(#screen)"/>
  <!-- glow of the lit Tile, one pixel wide -->
  <rect x="2" y="6" width="10" height="9" rx="2" fill="#58a8ff" opacity="0.3"/>
  <!-- Tiles: 3 x 2, the first one lit -->
  <rect x="3" y="7" width="8" height="7" rx="1" fill="url(#lit)"/>
  <rect x="12" y="7" width="8" height="7" rx="1" fill="url(#tile)"/>
  <rect x="21" y="7" width="8" height="7" rx="1" fill="url(#tile)"/>
  <rect x="3" y="15" width="8" height="7" rx="1" fill="url(#tile)"/>
  <rect x="12" y="15" width="8" height="7" rx="1" fill="url(#tile)"/>
  <rect x="21" y="15" width="8" height="7" rx="1" fill="url(#tile)"/>
  <!-- pager: an idle dot and the current Page pill -->
  <rect x="13" y="23" width="1" height="1" fill="#606470"/>
  <rect x="15" y="23" width="4" height="1" fill="#58a8ff"/>
</svg>
