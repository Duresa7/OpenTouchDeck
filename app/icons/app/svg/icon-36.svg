<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Open TouchDeck app icon, 36 px. Fitted to the 36 px grid: body 34 x 23 at y 6, 1 px clear each side, 1 px rim, case edge 2 px, Tiles 8 x 6 with 2 px gaps, 3 px in from the body edge, pager 1 px high. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d889b"/>
      <stop offset="0.4" stop-color="#4e5766"/>
      <stop offset="1" stop-color="#454d5a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272c34"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42649a"/>
      <stop offset="1" stop-color="#375485"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d6ff"/>
      <stop offset="1" stop-color="#4c9df6"/>
    </linearGradient>
  </defs>
  <!-- case edge -->
  <rect x="1" y="8" width="34" height="23" rx="4" fill="#5f6b80"/>
  <!-- rim: the lighter edge that keeps the outline on a dark taskbar -->
  <rect x="1" y="6" width="34" height="23" rx="4" fill="url(#rim)"/>
  <!-- black glass -->
  <rect x="2" y="7" width="32" height="21" rx="3" fill="url(#glass)"/>
  <!-- screen -->
  <rect x="3" y="8" width="30" height="19" rx="2" fill="url(#screen)"/>
  <!-- glow of the lit Tile, one pixel wide -->
  <rect x="3" y="8" width="10" height="8" rx="2" fill="#58a8ff" opacity="0.3"/>
  <!-- Tiles: 3 x 2, the first one lit -->
  <rect x="4" y="9" width="8" height="6" rx="1" fill="url(#lit)"/>
  <rect x="14" y="9" width="8" height="6" rx="1" fill="url(#tile)"/>
  <rect x="24" y="9" width="8" height="6" rx="1" fill="url(#tile)"/>
  <rect x="4" y="17" width="8" height="6" rx="1" fill="url(#tile)"/>
  <rect x="14" y="17" width="8" height="6" rx="1" fill="url(#tile)"/>
  <rect x="24" y="17" width="8" height="6" rx="1" fill="url(#tile)"/>
  <!-- pager: an idle dot and the current Page pill -->
  <rect x="15" y="25" width="1" height="1" fill="#606470"/>
  <rect x="17" y="25" width="4" height="1" fill="#58a8ff"/>
</svg>
