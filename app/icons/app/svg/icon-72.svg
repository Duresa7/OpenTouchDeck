<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <!-- Open TouchDeck app icon, 72 px. Fitted to the 72 px grid: body 64 x 42 at y 13, 4 px clear each side, 1 px rim, case edge 3 px, Tiles 16 x 12 with 2 px gaps, 6 px in from the body edge, pager 2 px high. The master redrawn with every edge on a whole pixel. -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7789"/>
      <stop offset="1" stop-color="#3a4350"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#868d98"/>
      <stop offset="0.5" stop-color="#3f444b"/>
      <stop offset="1" stop-color="#2a2d31"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30363f"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4263"/>
      <stop offset="1" stop-color="#20304a"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d6ff"/>
      <stop offset="1" stop-color="#4c9df6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.97"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.53"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="7" y="16" width="58" height="36" rx="3.5"/>
    </clipPath>
  </defs>
  <!-- contact shadow -->
  <ellipse cx="36" cy="59" rx="28" ry="2.5" fill="#000000" opacity="0.30" filter="url(#soft)"/>
  <!-- case: the edge of the body under the glass -->
  <rect x="4" y="16" width="64" height="42" rx="7.5" fill="url(#case)"/>
  <!-- black glass face, with a one-pixel rim -->
  <rect x="4" y="13" width="64" height="42" rx="7.5" fill="url(#rim)"/>
  <rect x="5" y="14" width="62" height="40" rx="6.5" fill="url(#glass)"/>
  <!-- screen -->
  <rect x="7" y="16" width="58" height="36" rx="3.5" fill="url(#screen)"/>
  <g clip-path="url(#screenClip)">
    <rect x="8" y="17" width="20" height="16" rx="4.5" fill="#58a8ff" opacity="0.55" filter="url(#glow)"/>
  </g>
  <!-- Tiles: 3 x 2, the first one lit -->
  <rect x="10" y="19" width="16" height="12" rx="2.5" fill="url(#lit)"/>
  <rect x="10.5" y="19.5" width="15" height="11" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
  <rect x="28" y="19" width="16" height="12" rx="2.5" fill="url(#tile)"/>
  <rect x="46" y="19" width="16" height="12" rx="2.5" fill="url(#tile)"/>
  <rect x="10" y="33" width="16" height="12" rx="2.5" fill="url(#tile)"/>
  <rect x="28" y="33" width="16" height="12" rx="2.5" fill="url(#tile)"/>
  <rect x="46" y="33" width="16" height="12" rx="2.5" fill="url(#tile)"/>
  <!-- pager: an idle dot and the current Page pill -->
  <rect x="32" y="47" width="2" height="2" rx="1" fill="#606470"/>
  <rect x="35" y="47" width="5" height="2" rx="1" fill="#58a8ff"/>
</svg>
