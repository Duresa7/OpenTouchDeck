<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Open TouchDeck tray icon, 32 px. Fitted to the 32 px grid: body 32 x 20 at y 5, 1 px rim, case edge 2 px, Tiles 8 x 7 with 2 px gaps, 2 px in from the body edge, no pager. The 16 px drawing at twice the size. -->
  <!-- case edge -->
  <rect x="0" y="7" width="32" height="20" rx="4" fill="#66738a"/>
  <!-- rim: the lighter edge that keeps the outline on a dark taskbar -->
  <rect x="0" y="5" width="32" height="20" rx="4" fill="#566072"/>
  <!-- black glass -->
  <rect x="1" y="6" width="30" height="18" rx="3" fill="#151a21"/>
  <!-- Tiles: 3 x 2, the first one lit -->
  <rect x="2" y="7" width="8" height="7" rx="1" fill="#8ccaff"/>
  <rect x="12" y="7" width="8" height="7" rx="1" fill="#4f77b4"/>
  <rect x="22" y="7" width="8" height="7" rx="1" fill="#4f77b4"/>
  <rect x="2" y="16" width="8" height="7" rx="1" fill="#4f77b4"/>
  <rect x="12" y="16" width="8" height="7" rx="1" fill="#4f77b4"/>
  <rect x="22" y="16" width="8" height="7" rx="1" fill="#4f77b4"/>
</svg>
