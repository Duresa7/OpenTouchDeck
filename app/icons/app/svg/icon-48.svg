<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Open TouchDeck app icon, 48 px. Fitted to the 48 px grid: body 42 x 30 at y 8, 3 px clear each side, 1 px rim, case edge 2 px, Tiles 10 x 8 with 2 px gaps, 4 px in from the body edge, pager 2 px high. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d889b"/>
      <stop offset="0.4" stop-color="#4e5766"/>
      <stop offset="1" stop-color="#454d5a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272c34"/>
      <stop offset="1" stop-color="#15171a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1826"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35507d"/>
      <stop offset="1" stop-color="#283f68"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d6ff"/>
      <stop offset="1" stop-color="#4c9df6"/>
    </linearGradient>
  </defs>
  <!-- case edge -->
  <rect x="3" y="10" width="42" height="30" rx="5" fill="#5f6b80"/>
  <!-- rim: the lighter edge that keeps the outline on a dark taskbar -->
  <rect x="3" y="8" width="42" height="30" rx="5" fill="url(#rim)"/>
  <!-- black glass -->
  <rect x="4" y="9" width="40" height="28" rx="4" fill="url(#glass)"/>
  <!-- screen -->
  <rect x="5" y="10" width="38" height="26" rx="3" fill="url(#screen)"/>
  <!-- glow of the lit Tile, one pixel wide -->
  <rect x="6" y="11" width="12" height="10" rx="2.5" fill="#58a8ff" opacity="0.35"/>
  <!-- Tiles: 3 x 2, the first one lit -->
  <rect x="7" y="12" width="10" height="8" rx="1.5" fill="url(#lit)"/>
  <rect x="19" y="12" width="10" height="8" rx="1.5" fill="url(#tile)"/>
  <rect x="31" y="12" width="10" height="8" rx="1.5" fill="url(#tile)"/>
  <rect x="7" y="22" width="10" height="8" rx="1.5" fill="url(#tile)"/>
  <rect x="19" y="22" width="10" height="8" rx="1.5" fill="url(#tile)"/>
  <rect x="31" y="22" width="10" height="8" rx="1.5" fill="url(#tile)"/>
  <!-- pager: an idle dot and the current Page pill -->
  <rect x="19" y="32" width="2" height="2" rx="1" fill="#606470"/>
  <rect x="23" y="32" width="6" height="2" rx="1" fill="#58a8ff"/>
</svg>
